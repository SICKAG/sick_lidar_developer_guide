<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
  <title id="title">Voltage drop on a sensor supply cable</title>
  <desc id="desc">A power supply with voltage U feeds a sensor through a cable. The supply wire and the return wire each have half the loop resistance. The current I causes a voltage drop on both wires, so the sensor receives U minus the voltage drop.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Noto Sans", Arial, sans-serif; fill: #000000; }
    .label { font-size: 15px; }
    .small { font-size: 13px; fill: #555555; }
    .bold { font-size: 16px; font-weight: 700; }
    .italic { font-size: 16px; font-style: italic; }
  </style>

  <!-- Power supply -->
  <rect x="20" y="70" width="150" height="160" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="95" y="100" text-anchor="middle" class="bold">Power supply</text>
  <circle cx="95" cy="160" r="28" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="95" y="153" text-anchor="middle" class="label">+</text>
  <text x="95" y="177" text-anchor="middle" class="label">−</text>
  <text x="95" y="216" text-anchor="middle" class="italic">U</text>

  <!-- Sensor -->
  <rect x="590" y="70" width="150" height="160" fill="#e6e6e6" stroke="#000000" stroke-width="1.5"/>
  <text x="665" y="100" text-anchor="middle" class="bold">Sensor</text>
  <text x="665" y="145" text-anchor="middle" class="small">Vs pin</text>
  <text x="665" y="190" text-anchor="middle" class="small">GND pin</text>
  <text x="665" y="216" text-anchor="middle" class="italic">Us = U − ΔU</text>

  <!-- Supply wire -->
  <line x1="170" y1="120" x2="300" y2="120" stroke="#000000" stroke-width="1.5"/>
  <rect x="300" y="108" width="140" height="24" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="370" y="125" text-anchor="middle" class="italic">R/2</text>
  <line x1="440" y1="120" x2="590" y2="120" stroke="#000000" stroke-width="1.5"/>
  <text x="370" y="98" text-anchor="middle" class="small">Supply wire (Vs)</text>

  <!-- Return wire -->
  <line x1="170" y1="200" x2="300" y2="200" stroke="#000000" stroke-width="1.5"/>
  <rect x="300" y="188" width="140" height="24" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="370" y="205" text-anchor="middle" class="italic">R/2</text>
  <line x1="440" y1="200" x2="590" y2="200" stroke="#000000" stroke-width="1.5"/>
  <text x="370" y="232" text-anchor="middle" class="small">Return wire (GND)</text>

  <!-- Current -->
  <line x1="200" y1="136" x2="268" y2="136" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="234" y="156" text-anchor="middle" class="italic">I</text>
  <line x1="268" y1="184" x2="200" y2="184" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Voltage drops -->
  <line x1="300" y1="60" x2="440" y2="60" stroke="#555555" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="370" y="50" text-anchor="middle" class="italic">ΔU/2</text>
  <line x1="300" y1="256" x2="440" y2="256" stroke="#555555" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="370" y="282" text-anchor="middle" class="italic">ΔU/2</text>

  <!-- Formula -->
  <text x="515" y="40" text-anchor="middle" class="label">ΔU = I · R</text>
</svg>
